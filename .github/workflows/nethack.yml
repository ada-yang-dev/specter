name: nethack

on: workflow_dispatch

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v24
      - name: Play
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: nix run .#nethack -- -m anthropic/claude-sonnet-4-20250514 "NetHack is already open via specter. Keep calling specter tools to play until you die (or ascend!). You may narrate your thinking, but don't wait for user input. Report your experience after the journey ends. Have fun!"
