name: nethack

on: workflow_dispatch

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v24

      - name: Build
        run: |
          nix develop --command true
          nix build nixpkgs#nethack --no-link

      - name: Explore the dungeon
        timeout-minutes: 360
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          nix develop --command opencode run -m anthropic/claude-opus-4-5 '
            Use specter to spawn a terminal and play NetHack autonomously (nix run nixpkgs#nethack).
            When your journey ends, reflect on what you encountered, decisions you made, and how it concluded.
          '
