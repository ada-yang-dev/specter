name: vimgolf

on: workflow_dispatch

jobs:
  golf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v24
      - name: Pick challenge
        run: echo "ID=$(curl -s http://feeds.vimgolf.com/latest-challenges | grep -oP '9v[a-f0-9]+' | shuf -n1)" >> $GITHUB_ENV
      - name: Golf
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: nix run .#vimgolf -- -m anthropic/claude-sonnet-4-20250514 "Play vimgolf challenge $ID"
