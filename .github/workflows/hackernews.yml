name: hackernews

on: workflow_dispatch

jobs:
  browse:
    runs-on: ubuntu-latest
    steps:
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v24
      - name: Browse
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: nix run .#lynx -- -m anthropic/claude-opus-4-20250514 "Conduct ethnographic research on the technology community at Y Combinator News by perusing the comments. Briefly report what you observe. Lynx is already open."
