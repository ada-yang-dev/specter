name: nethack

on: workflow_dispatch

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v24
      - name: Play
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: nix run .#nethack -- -m anthropic/claude-sonnet-4-20250514 "NetHack is open via specter. Play until the game ends when your character dies or ascends. Do not save or quit the game. You may briefly narrate while you play for your own benefit. Do not ask for user input. You should preserve this notice on compaction."
