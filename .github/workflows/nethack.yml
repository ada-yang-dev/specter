name: nethack

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v24

      - name: Build
        run: |
          nix develop --command true
          nix build nixpkgs#nethack --no-link

      - name: Explore the dungeon
        timeout-minutes: 15
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          nix develop --command opencode run -m anthropic/claude-sonnet-4-5 '
            Use specter to spawn a terminal and play NetHack autonomously (nix run nixpkgs#nethack).
            When your journey ends, write ./nethack-report.txt reflecting on what you encountered, decisions you made, and how it concluded.
          '

      - name: Expedition report
        if: always()
        run: cat nethack-report.txt 2>/dev/null || echo "No report generated"
