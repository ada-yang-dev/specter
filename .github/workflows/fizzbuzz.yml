name: fizzbuzz

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v24

      - name: Build
        run: nix develop --command true

      - name: OpenCode operates OpenCode
        timeout-minutes: 5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          nix develop --command opencode run -m anthropic/claude-sonnet-4-5 '
            Use specter to spawn a terminal.
            Start an interactive opencode session (run: nix develop --command opencode -m anthropic/claude-sonnet-4-5).
            Through the terminal, ask it to write FizzBuzz 1-100 in bash and save output to ./fizzbuzz.txt.
            Watch the terminal, interact as needed, until the task completes.
          '

      - name: Verify
        run: |
          cat fizzbuzz.txt
          fb() { [[ $((($1%15))) -eq 0 ]] && echo FizzBuzz || { [[ $((($1%3))) -eq 0 ]] && echo Fizz || { [[ $((($1%5))) -eq 0 ]] && echo Buzz || echo $1; }; }; }
          diff <(for i in $(seq 1 100); do fb $i; done) fizzbuzz.txt
