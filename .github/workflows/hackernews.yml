name: hackernews

on: workflow_dispatch

jobs:
  browse:
    runs-on: ubuntu-latest
    steps:
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v24
      - name: Browse
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: nix run .#lynx -- -m anthropic/claude-sonnet-4-5 "Conduct ethnographic research on https://news.ycombinator.com/active using lynx. Share your observations."
