name: hackernews

on: workflow_dispatch

jobs:
  browse:
    runs-on: ubuntu-latest
    steps:
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Browse
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: nix run .#lynx -- -m anthropic/claude-opus-4-5 "Browse https://news.ycombinator.com/active using lynx. Peruse some comment threads that you find interesting. Share ethnographic observations about the community's discourse patterns."
