name: nethack

on: workflow_dispatch

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v24
      - name: Play
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: nix run .#nethack -- -m anthropic/claude-opus-4-5 "Have fun playing NetHack! Push the envelope - see how far you can go. This is an autonomous session; it is critical that you do not ask for user feedback, as doing so would terminate the session inadvertently. Report back only after your character has died or ascended. Keep calling specter to maintain the session without human intervention. Tip - gas spores should be avoided or handled with extreme caution (ideally by a pet or from maximum distance)."
