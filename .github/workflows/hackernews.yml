name: hackernews

on: workflow_dispatch

jobs:
  browse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v24
      - name: Browse
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: nix run .#lynx -- -m anthropic/claude-sonnet-4-20250514 "Take a look at Y Combinator News on the main site and tell us what you think is interesting - you can flip through the comments. You already have lynx opened."
